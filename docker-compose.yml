# AuthSec — full stack via Docker Compose
#
#   docker compose up --build      -> web http://localhost:8080, api http://localhost:5000
#
# Secrets below fall back to development values. For anything real, put them in a
# root `.env` file (see .env.example) and Compose will pick them up automatically.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - '27017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '5000'
      MONGO_URI: mongodb://mongo:27017/authsec
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      API_URL: ${API_URL:-http://localhost:5000}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-dev_access_secret_change_me_please_000000}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-dev_refresh_secret_change_me_please_000000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:8080}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@authsec.dev}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@12345}
    # Seed demo data on first boot, then start the API.
    command: sh -c "npm run seed:if-empty && node src/server.js"
    ports:
      - '5000:5000'

  web:
    build: ./client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '8080:80'

volumes:
  mongo-data:
